<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oportunidades / Possíveis desajustes</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111716;color:#e8efea;font:14px/1.5 'Segoe UI',sans-serif}main{max-width:1500px;margin:auto;padding:26px}a{color:#bde77a;background:#111716}h1{font-size:26px;margin-bottom:8px}p,small{color:#a7b9af;background:#111716}small{display:block}.filters{color:#e8efea;display:flex;flex-wrap:wrap;gap:16px;padding:18px;background:#19211f;margin:22px 0}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;color:#e8efea;background:#111a16;border:1px solid #526157;border-radius:5px;padding:9px}button{cursor:pointer}.notice{padding:16px;border:1px solid #34413b;margin:16px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #34413b;vertical-align:top}th{background:#111716;color:#a7b9af;font-size:12px}strong{color:#bde77a;background:#111716}.tag{white-space:nowrap}@media(max-width:650px){main{padding:16px}.filters label{width:100%}th,td{padding:10px;min-width:140px}}
</style><main><a href="./">← Voltar ao painel</a><h1>Oportunidades / Possíveis desajustes</h1><p>Compare sinais de preço, possíveis surebets e favorito com odd alta no primeiro tempo. Os sinais não confirmam erro ou vantagem estatística.</p><div class="filters"><label>Visualização<select id="view"><option value="signals">Oportunidades e sinais</option><option value="odds">Todas as odds disponíveis</option></select></label><label>Modo<select id="mode"><option value="">Ao vivo e pré-jogo</option><option value="live">Ao vivo</option><option value="prematch">Pré-jogo</option></select></label><label>Tipo<select id="kind"><option value="">Todos os sinais</option><option value="surebet_candidate">Possível surebet</option><option value="price_gap">Diferença entre casas</option><option value="favourite_first_half">Favorito / primeiro tempo</option></select></label><label>Jogo ou casa<input id="query" type="search" placeholder="Buscar time ou casa"></label><label>Casa<select id="house"><option value="">Todas as casas</option></select></label><button id="reload">Atualizar tela</button></div><div id="status" class="notice" role="status">Carregando análise…</div><div id="summary"></div><div id="rows"></div><p id="coverage"></p></main><script>
(()=>{
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stamp=s=>s?new Date(s).toLocaleString('pt-BR',{timeZone:'America/Fortaleza'}):'não informado';
const local=location.port==='4180',endpoint=local?'api/opportunities':'api/v1/opportunities.json',types={surebet_candidate:'Possível surebet',price_gap:'Possível desajuste entre casas',favourite_first_half:'Favorito / primeiro tempo'};
const names={giro:'Giro Certo',esporte:'Esportenet SP',melbet:'Melbet',jogos:'Esportenet Jogos',futamina:'Futamina',grana:'Granawin',exclusive:'ExclusiveBet',tobetano:'Tobetano',two:'2UP',sportsbet:'Sportsbet.io',stake:'Stake',fortune:'FortuneJack'};
for(const [id,name] of Object.entries(names))$('house').insertAdjacentHTML('beforeend','<option value="'+id+'">'+name+'</option>');
let data=null,busy=false,quoteData=[],liveSources=[],closedGames=[],quoteError="",quoteBusy=false,quotePage=0;
const quotes=s=>s.picks||[s.best,s.other].filter(Boolean);
const houses=s=>s.bookmakerId?[s.bookmakerId]:quotes(s).map(q=>q.bookmakerId);
function price(q){let link='';try{const u=new URL(q.sourceUrl);if(u.protocol==='https:')link='<a href="'+safe(u.href)+'" target="_blank" rel="noopener noreferrer">Abrir na casa</a>'}catch{}return '<div>'+safe(q.selectionLabel||q.selectionName||q.selection)+' · <strong>'+Number(q.decimalOdds).toFixed(2)+'</strong> · '+safe(names[q.bookmakerId]||q.bookmakerId)+'<small>'+stamp(q.observedAt)+'</small>'+link+'</div>'}
function draw(){if($('view').value==='odds'){drawQuotes();return}if(!data)return;const now=Date.now(),current=(data.signals||[]).filter(s=>{const age=now-Date.parse(s.observedAt);return age>=0&&age<=(s.mode==='live'?40000:300000)}),q=$('query').value.toLocaleLowerCase('pt-BR');
const rows=current.filter(s=>(!$('mode').value||s.mode===$('mode').value)&&(!$('kind').value||s.type===$('kind').value)&&(!$('house').value||houses(s).includes($('house').value))&&(!q||(s.event+' '+houses(s).map(h=>names[h]||h).join(' ')).toLocaleLowerCase('pt-BR').includes(q)));
$('summary').textContent=rows.length+' sinais neste filtro · '+current.length+' sinais dentro do prazo de atualização';
$('rows').innerHTML=rows.length?'<div class="scroll"><table><thead><tr><th>Modo / jogo</th><th>Tipo</th><th>Mercado / seleção / casa / odd</th><th>Comparação</th><th>Conferência</th></tr></thead><tbody>'+rows.slice(0,150).map(s=>{const score=s.scoreboard?.scores?.find(p=>p.periodScoreType===1&&p.period===1&&p.subPeriod==null&&!p.isRemoved)?.score,seconds=s.scoreboard?.timer?.currentTimeSeconds;return '<tr><td><span class="tag">'+(s.mode==='live'?'AO VIVO':'PRÉ-JOGO')+'</span><br>'+safe(s.event)+(s.mode==='live'?'<strong style="display:block">Placar: '+safe(score||'não informado')+'</strong>'+(Number.isFinite(seconds)?'<small>'+Math.floor(seconds/60)+'min '+seconds%60+'s</small>':''):'')+'<small>Coleta: '+stamp(s.observedAt)+'</small></td><td>'+safe(types[s.type]||s.type)+'</td><td>'+(s.type==='favourite_first_half'?safe(s.selection)+' · Tobetano<br>Vitória final: <strong>'+s.finalOdds.toFixed(2)+'</strong><br>Vitória no 1º tempo: <strong>'+s.firstHalfOdds.toFixed(2)+'</strong>':'<small>Resultado final · 90 minutos</small>'+quotes(s).map(price).join('<hr>'))+'</td><td>'+(s.type==='surebet_candidate'?'Retorno teórico: +'+s.profitPercent.toFixed(2)+'%':s.type==='price_gap'?'Diferença: '+s.gapPercent.toFixed(1)+'%':'Mesmo time, períodos diferentes')+'</td><td>'+safe(s.note)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="notice">Nenhum sinal atual neste filtro. Dados antigos são retirados automaticamente; isso não confirma ausência de oportunidades nas casas.</div>';
$('coverage').textContent=local?'Análise automática após as coletas. Ao vivo: Tobetano, Giro Certo, Futamina e Melbet, conforme disponibilidade. Pré-jogo: fontes disponíveis, com cobertura parcial. Links abrem a fonte; seleção no bilhete não é confirmada.':'GitHub Pages: snapshot pré-jogo. Para os sinais ao vivo e as coletas locais contínuas, abra o painel neste PC em http://127.0.0.1:4180/opportunities.html. Recarregar esta tela não executa uma nova coleta nas casas.';
}

async function loadQuotes(){if(quoteBusy)return;quoteBusy=true;quoteError='';try{
 const get=async path=>{const r=await fetch(path+'?t='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);return r.json()};
 const results=await Promise.allSettled([get(local?'api/prematch':'api/v1/football.json'),local?get('api/live'):Promise.resolve(null)]);const combined=[],errors=[];
 if(results[0].status==='fulfilled'){const a=results[0].value,events=new Map(a.events.map(e=>[e.id,e]));for(const q of a.quotes){const e=events.get(q.eventId);if(e)combined.push({...q,mode:'prematch',event:e.home+' × '+e.away,startsAt:e.startsAt,market:'Resultado final · 90 minutos',available:q.method==='automatic'&&q.freshness==='current'})}}else errors.push('Pré-jogo: '+results[0].reason.message);
 if(results[1].status==='fulfilled'&&results[1].value){liveSources=results[1].value.sources||[];closedGames=results[1].value.events.filter(g=>g.lifecycle);for(const g of results[1].value.events)for(const m of g.markets)for(const i of m.marketItems)for(const o of i.outcomes)combined.push({mode:'live',event:g.event.name,bookmakerId:g.bookmakerId,bookmakerName:g.bookmakerName,market:[m.name,m.resultKindName,m.periodName,i.lineLabel].filter(Boolean).join(' · '),selectionLabel:o.name||'Seleção '+o.key.type,decimalOdds:o.decimalOdds,observedAt:g.observedAt,score:g.event.scoreboard?.scores?.find(p=>p.periodScoreType===1&&p.period===1&&p.subPeriod==null&&!p.isRemoved)?.score,available:!o.isRemoved&&!o.isFrozen&&g.event.tradingStatus===1})}else if(results[1].status==='rejected')errors.push('Ao vivo: '+results[1].reason.message);
 quoteData=combined;quoteError=errors.join(' · ');
 }catch(e){quoteData=[];quoteError=e.message}finally{quoteBusy=false;if($('view').value==='odds')drawQuotes()}}
function drawQuotes(){
 $('kind').disabled=true;const mode=$('mode').value,house=$('house').value,query=$('query').value.toLocaleLowerCase('pt-BR'),now=Date.now();
 const rows=quoteData.filter(q=>q.available&&q.decimalOdds>1&&now>=Date.parse(q.observedAt)&&now-Date.parse(q.observedAt)<=(q.mode==='live'?40000:300000)&&(!mode||q.mode===mode)&&(!house||q.bookmakerId===house)&&(!query||(q.event+' '+(names[q.bookmakerId]||q.bookmakerId)+' '+q.market+' '+q.selectionLabel).toLocaleLowerCase('pt-BR').includes(query)));
 quotePage=Math.max(0,Math.min(quotePage,Math.ceil(rows.length/100)-1));$('summary').textContent=rows.length+' odds disponíveis no filtro · página '+(quotePage+1)+' · até 100 por página';
 let empty=quoteBusy?'Carregando odds…':'Nenhuma odd atual disponível neste filtro.';
 if(mode==='live'&&!local)empty='O GitHub publica pré-jogo. Para consultar o ao vivo, abra esta tela no painel local deste PC.';
 else if(mode==='live'&&house&&!['tobetano','giro','futamina','melbet'].includes(house))empty='Coleta ao vivo ainda não integrada para '+(names[house]||house)+'. Esta casa possui somente a cobertura pré-jogo disponível no sistema.';
 $('rows').innerHTML=rows.length?'<div class="scroll"><table><thead><tr><th>Modo / jogo / placar</th><th>Casa</th><th>Mercado</th><th>Seleção</th><th>Odd</th><th>Coleta · Fortaleza</th></tr></thead><tbody>'+rows.slice(quotePage*100,quotePage*100+100).map(q=>'<tr><td>'+(q.mode==='live'?'AO VIVO':'PRÉ-JOGO')+'<br>'+safe(q.event)+(q.mode==='live'?'<strong style="display:block">Placar: '+safe(q.score||'não informado')+'</strong>':'')+'</td><td>'+safe(names[q.bookmakerId]||q.bookmakerId)+'</td><td>'+safe(q.market)+'</td><td>'+safe(q.selectionLabel||q.selectionName)+'</td><td><strong>'+Number(q.decimalOdds).toFixed(2)+'</strong></td><td>'+stamp(q.observedAt)+'</td></tr>').join('')+'</tbody></table></div><button id="quotePrev" '+(!quotePage?'disabled':'')+'>Anterior</button> <button id="quoteNext" '+((quotePage+1)*100>=rows.length?'disabled':'')+'>Próxima</button>':'<div class="notice">'+safe(empty)+'</div>';
 if($('quotePrev'))$('quotePrev').onclick=()=>{quotePage--;drawQuotes()};if($('quoteNext'))$('quoteNext').onclick=()=>{quotePage++;drawQuotes()};
 $('coverage').textContent=(quoteError?'Falha de consulta: '+quoteError+'. ':'')+'Ao vivo integrado: Tobetano, Giro Certo, Futamina e Melbet (resultado final 1X2 nas novas fontes). Pré-jogo: casas disponíveis. Odds suspensas e observações antigas ficam fora. Selecionar uma casa não habilita coleta que ainda não existe.'+(liveSources.length?' Situação: '+liveSources.map(s=>(names[s.id]||s.id)+': '+s.status+(s.error?' ('+s.error+')':'')).join(' · '):'');
 const ended=closedGames.filter(g=>(!house||g.bookmakerId===house)&&(!query||g.event.name.toLocaleLowerCase('pt-BR').includes(query)));if(mode!=='prematch'&&ended.length)$('rows').insertAdjacentHTML('beforeend','<h2>Jogos sem odds disponíveis</h2>'+ended.map(g=>'<div class="notice">'+safe(g.bookmakerName)+' · '+safe(g.event.name)+' · <strong>'+safe(g.lifecycle==='finished'?'ENCERRADO':'SEM ATUALIZAÇÃO')+'</strong> · último placar '+safe(g.event.scoreboard?.scores?.find(s=>s.periodScoreType===1&&s.period===1&&!s.isRemoved)?.score||'não informado')+(g.deleteAt?' · exclusão do histórico: '+stamp(g.deleteAt):' · encerramento ainda não confirmado')+'</div>').join(''));
}

async function load(){if(busy)return;busy=true;$('reload').disabled=true;try{const r=await fetch(endpoint+'?t='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();$('status').textContent='Análise: '+stamp(data.generatedAt)+' · pré-jogo: '+stamp(data.prematch?.sourceAt)+' · ao vivo: '+stamp(data.live?.sourceAt)+' · horários de Fortaleza';draw()}catch(e){$('status').textContent='Falha ao consultar análise: '+e.message;data=null;$('rows').textContent='Sem confirmação de sinais atuais.';$('summary').textContent=''}finally{busy=false;$('reload').disabled=false}}
for(const id of ['mode','kind','query','house'])$(id).oninput=()=>{quotePage=0;draw()};$('view').oninput=()=>{$('kind').disabled=$('view').value==='odds';quotePage=0;draw();if($('view').value==='odds')loadQuotes()};setInterval(()=>{if($('view').value==='odds')loadQuotes()},local?20000:60000);$('reload').onclick=()=>{load();if($('view').value==='odds')loadQuotes()};load();setInterval(load,local?20000:60000);setInterval(draw,1000);if(local){const events=new EventSource('api/events');events.onmessage=load}
})();
</script></html>
