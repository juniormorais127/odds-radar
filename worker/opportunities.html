<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oportunidades / Possíveis desajustes</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111716;color:#e8efea;font:14px/1.5 'Segoe UI',sans-serif}main{max-width:1500px;margin:auto;padding:26px}a{color:#bde77a;background:#111716}h1{font-size:26px;margin-bottom:8px}p,small{color:#a7b9af;background:#111716}small{display:block}.filters{color:#e8efea;display:flex;flex-wrap:wrap;gap:16px;padding:18px;background:#19211f;margin:22px 0}label{display:flex;flex-direction:column;gap:6px}input,select,button{font:inherit;color:#e8efea;background:#111a16;border:1px solid #526157;border-radius:5px;padding:9px}button{cursor:pointer}.notice{padding:16px;border:1px solid #34413b;margin:16px 0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #34413b;vertical-align:top}th{background:#111716;color:#a7b9af;font-size:12px}strong{color:#bde77a;background:#111716}.tag{white-space:nowrap}@media(max-width:650px){main{padding:16px}.filters label{width:100%}th,td{padding:10px;min-width:140px}}
</style><main><a href="./">← Voltar ao painel</a><h1>Oportunidades / Possíveis desajustes</h1><p>Compare sinais de preço, possíveis surebets e favorito com odd alta no primeiro tempo. Os sinais não confirmam erro ou vantagem estatística.</p><div class="filters"><label>Modo<select id="mode"><option value="">Ao vivo e pré-jogo</option><option value="live">Ao vivo</option><option value="prematch">Pré-jogo</option></select></label><label>Tipo<select id="kind"><option value="">Todos os sinais</option><option value="surebet_candidate">Possível surebet</option><option value="price_gap">Diferença entre casas</option><option value="favourite_first_half">Favorito / primeiro tempo</option></select></label><label>Jogo ou casa<input id="query" type="search" placeholder="Buscar time ou casa"></label><label>Casa<select id="house"><option value="">Todas as casas</option></select></label><button id="reload">Atualizar tela</button></div><div id="status" class="notice" role="status">Carregando análise…</div><div id="summary"></div><div id="rows"></div><p id="coverage"></p></main><script>
(()=>{
const $=id=>document.getElementById(id),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stamp=s=>s?new Date(s).toLocaleString('pt-BR',{timeZone:'America/Fortaleza'}):'não informado';
const local=location.port==='4180',endpoint=local?'api/opportunities':'api/v1/opportunities.json',types={surebet_candidate:'Possível surebet',price_gap:'Possível desajuste entre casas',favourite_first_half:'Favorito / primeiro tempo'};
const names={giro:'Giro Certo',esporte:'Esportenet SP',melbet:'Melbet',jogos:'Esportenet Jogos',futamina:'Futamina',grana:'Granawin',exclusive:'ExclusiveBet',tobetano:'Tobetano',two:'2UP',sportsbet:'Sportsbet.io',stake:'Stake',fortune:'FortuneJack'};
for(const [id,name] of Object.entries(names))$('house').insertAdjacentHTML('beforeend','<option value="'+id+'">'+name+'</option>');
let data=null,busy=false;
const quotes=s=>s.picks||[s.best,s.other].filter(Boolean);
const houses=s=>s.bookmakerId?[s.bookmakerId]:quotes(s).map(q=>q.bookmakerId);
function price(q){let link='';try{const u=new URL(q.sourceUrl);if(u.protocol==='https:')link='<a href="'+safe(u.href)+'" target="_blank" rel="noopener noreferrer">Abrir na casa</a>'}catch{}return '<div>'+safe(q.selectionLabel||q.selectionName||q.selection)+' · <strong>'+Number(q.decimalOdds).toFixed(2)+'</strong> · '+safe(names[q.bookmakerId]||q.bookmakerId)+'<small>'+stamp(q.observedAt)+'</small>'+link+'</div>'}
function draw(){if(!data)return;const now=Date.now(),current=(data.signals||[]).filter(s=>{const age=now-Date.parse(s.observedAt);return age>=0&&age<=(s.mode==='live'?40000:300000)}),q=$('query').value.toLocaleLowerCase('pt-BR');
const rows=current.filter(s=>(!$('mode').value||s.mode===$('mode').value)&&(!$('kind').value||s.type===$('kind').value)&&(!$('house').value||houses(s).includes($('house').value))&&(!q||(s.event+' '+houses(s).map(h=>names[h]||h).join(' ')).toLocaleLowerCase('pt-BR').includes(q)));
$('summary').textContent=rows.length+' sinais neste filtro · '+current.length+' sinais dentro do prazo de atualização';
$('rows').innerHTML=rows.length?'<div class="scroll"><table><thead><tr><th>Modo / jogo</th><th>Tipo</th><th>Mercado / seleção / casa / odd</th><th>Comparação</th><th>Conferência</th></tr></thead><tbody>'+rows.slice(0,150).map(s=>{const score=s.scoreboard?.scores?.find(p=>p.periodScoreType===1&&p.period===1&&p.subPeriod==null&&!p.isRemoved)?.score,seconds=s.scoreboard?.timer?.currentTimeSeconds;return '<tr><td><span class="tag">'+(s.mode==='live'?'AO VIVO':'PRÉ-JOGO')+'</span><br>'+safe(s.event)+(s.mode==='live'?'<strong style="display:block">Placar: '+safe(score||'não informado')+'</strong>'+(Number.isFinite(seconds)?'<small>'+Math.floor(seconds/60)+'min '+seconds%60+'s</small>':''):'')+'<small>Coleta: '+stamp(s.observedAt)+'</small></td><td>'+safe(types[s.type]||s.type)+'</td><td>'+(s.type==='favourite_first_half'?safe(s.selection)+' · Tobetano<br>Vitória final: <strong>'+s.finalOdds.toFixed(2)+'</strong><br>Vitória no 1º tempo: <strong>'+s.firstHalfOdds.toFixed(2)+'</strong>':'<small>Resultado final · 90 minutos</small>'+quotes(s).map(price).join('<hr>'))+'</td><td>'+(s.type==='surebet_candidate'?'Retorno teórico: +'+s.profitPercent.toFixed(2)+'%':s.type==='price_gap'?'Diferença: '+s.gapPercent.toFixed(1)+'%':'Mesmo time, períodos diferentes')+'</td><td>'+safe(s.note)+'</td></tr>'}).join('')+'</tbody></table></div>':'<div class="notice">Nenhum sinal atual neste filtro. Dados antigos são retirados automaticamente; isso não confirma ausência de oportunidades nas casas.</div>';
$('coverage').textContent=local?'Análise automática após as coletas. Ao vivo: somente Tobetano. Pré-jogo: fontes disponíveis, com cobertura parcial. Links abrem a fonte; seleção no bilhete não é confirmada.':'GitHub Pages: snapshot pré-jogo. Para os sinais ao vivo e as coletas locais contínuas, abra o painel neste PC em http://127.0.0.1:4180/opportunities.html. Recarregar esta tela não executa uma nova coleta nas casas.';
}
async function load(){if(busy)return;busy=true;$('reload').disabled=true;try{const r=await fetch(endpoint+'?t='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();$('status').textContent='Análise: '+stamp(data.generatedAt)+' · pré-jogo: '+stamp(data.prematch?.sourceAt)+' · ao vivo: '+stamp(data.live?.sourceAt)+' · horários de Fortaleza';draw()}catch(e){$('status').textContent='Falha ao consultar análise: '+e.message;data=null;$('rows').textContent='Sem confirmação de sinais atuais.';$('summary').textContent=''}finally{busy=false;$('reload').disabled=false}}
for(const id of ['mode','kind','query','house'])$(id).oninput=draw;$('reload').onclick=load;load();setInterval(load,local?20000:60000);setInterval(draw,1000);if(local){const events=new EventSource('api/events');events.onmessage=load}
})();
</script></html>
